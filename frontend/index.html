<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IntelliMetrics AI: one governed definition for every business metric, with TARA, your AI analyst." />
    <meta name="color-scheme" content="light dark" />
    <title>IntelliMetrics AI</title>
    <script>
      // Apply the saved theme before first paint: no flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("im-theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          if (dark) r.classList.add("dark");
          r.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
