name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: Alembic migrations apply cleanly
        working-directory: backend
        env: { DATABASE_URL: "sqlite:////tmp/ci-migrate.db" }
        run: alembic upgrade head
      - name: Pytest
        working-directory: backend
        run: pytest -q

  backend-postgres:
    name: Backend (pytest, PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: im, POSTGRES_PASSWORD: im, POSTGRES_DB: im_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U im" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: Alembic upgrade on PostgreSQL
        working-directory: backend
        env: { DATABASE_URL: "postgresql://im:im@localhost:5432/im_test" }
        run: alembic upgrade head
      - name: Pytest against PostgreSQL
        working-directory: backend
        env: { TEST_DATABASE_URL: "postgresql://im:im@localhost:5432/im_test", TEST_SKIP_CREATE_ALL: "1" }
        run: pytest -q

  frontend:
    name: Frontend (typecheck, Vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
